upstream web_app {
    # Memória compartilhada: o round-robin passa a ser global entre os workers
    # do nginx (sem ela, cada worker recomeça do 1º servidor e, com poucas
    # requisições, todas caem na mesma réplica do web).
    zone web_app 64k;

    # "web" é resolvido pelo DNS interno do Docker (127.0.0.11) na inicialização;
    # com --scale web=N ele devolve N IPs e todos entram no balanceamento.
    server web:5000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # O padrão do nginx é 1 MB; fotos de celular passam disso (erro 413)
    client_max_body_size 10m;

    # Índice da API na raiz. O app.py (que não pode ser alterado) não tem rota "/",
    # então o próprio proxy responde, sem chegar ao web.
    location = / {
        default_type "application/json; charset=utf-8";
        return 200 '{"aplicacao":"Achados & Perdidos","rotas":[{"metodo":"GET","rota":"/health","descricao":"Saúde da API e conexão com o banco"},{"metodo":"GET","rota":"/itens","descricao":"Lista os objetos; filtro opcional ?local=texto"},{"metodo":"POST","rota":"/itens","descricao":"Cadastra objeto (multipart: descricao, local, foto opcional)"},{"metodo":"GET","rota":"/fotos/<nome>","descricao":"Devolve a foto armazenada no volume"},{"metodo":"GET","rota":"/estatisticas","descricao":"Total de itens no banco e de fotos no volume"}]}\n';
    }

    location / {
        proxy_pass         http://web_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
