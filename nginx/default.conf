upstream web_app {
    # Memória compartilhada: o round-robin passa a ser global entre os workers
    # do nginx (sem ela, cada worker recomeça do 1º servidor e, com poucas
    # requisições, todas caem na mesma réplica do web).
    zone web_app 64k;

    # "web" é resolvido pelo DNS interno do Docker (127.0.0.11) na inicialização;
    # com --scale web=N ele devolve N IPs e todos entram no balanceamento.
    server web:5000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # O padrão do nginx é 1 MB; fotos de celular passam disso (erro 413)
    client_max_body_size 10m;

    location / {
        proxy_pass         http://web_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
